# Zolai Explorer — nginx reference for pcore-server
#
# The studio is served from its OWN host, `studio.zolai.space`, by a standalone
# vhost installed at:
#
#   /etc/nginx/sites-available/zolai-studio   (symlinked into sites-enabled)
#
# It is already installed. `scripts/deploy.sh` never edits it — it only rsyncs
# `dist/` into the document root. This file is a *reference copy* so the deployed
# config is reviewable in git; if you change the live vhost, change it here too.
#
#   sudo cp deploy/nginx/zolai-explorer.conf /etc/nginx/sites-available/zolai-studio
#   sudo nginx -t && sudo systemctl reload nginx
#
# Because the studio is a separate server_name, nothing here can interfere with
# the FastAPI surface on api.zolai.space. That vhost keeps `location /` proxied
# to 127.0.0.1:8001 and only 301-redirects /explorer* to this host.

server {
    listen 80;
    listen [::]:80;
    server_name studio.zolai.space;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;

    server_name studio.zolai.space;

    ssl_certificate     /etc/letsencrypt/live/studio.zolai.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.zolai.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # `dist/` is rsynced straight into this root, so $uri resolves directly
    # (no `root` + prefix concatenation trick is needed at base '/').
    root /var/www/zolai-studio;
    index index.html;

    # SPA: every deep link (/word/pasian, /links, ...) falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable — cache them for a year.
    location /assets/ {
        add_header Cache-Control "public,max-age=31536000,immutable";
    }

    # The entry document must always be revalidated so a deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}