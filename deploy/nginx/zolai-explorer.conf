# Zolai Explorer — nginx snippet for pcore-server
#
# Install into the api.zolai.space TLS server block:
#   sudo cp deploy/nginx/zolai-explorer.conf /etc/nginx/conf.d/zolai-explorer.conf
# ...OR paste the block below into /etc/nginx/sites-available/zolai-api,
# ABOVE the existing `location /` (which proxies to 127.0.0.1:8001).
#
# Why `root` + a prefix location concatenates:
#   with `root /var/www/zolai-explorer`, a request for /explorer/index.html
#   resolves to /var/www/zolai-explorer/explorer/index.html. The bundle must
#   therefore be deployed to /var/www/zolai-explorer/explorer/ (see
#   scripts/deploy.sh), not directly into /var/www/zolai-explorer/.
#
# Apply with:
#   sudo nginx -t && sudo systemctl reload nginx

location = /explorer {
    return 301 /explorer/;
}

location /explorer/ {
    root /var/www/zolai-explorer;
    try_files $uri $uri/ /explorer/index.html;
}

# Hashed Vite assets are immutable — cache them for a year.
location /explorer/assets/ {
    root /var/www/zolai-explorer;
    try_files $uri =404;
    add_header Cache-Control "public,max-age=31536000,immutable";
}

# The entry document must always be revalidated so a deploy is picked up.
location = /explorer/index.html {
    root /var/www/zolai-explorer;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}