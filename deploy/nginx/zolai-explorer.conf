# Zolai Explorer — nginx reference for pcore-server
#
# The studio is served from its OWN host, `studio.zolai.space`, by a standalone
# vhost installed at:
#
#   /etc/nginx/sites-available/zolai-studio   (symlinked into sites-enabled)
#
# It is already installed. `scripts/deploy.sh` never edits it — it only rsyncs
# `dist/` into the document root. This file is a *reference copy* so the deployed
# config is reviewable in git; if you change the live vhost, change it here too.
#
#   sudo cp deploy/nginx/zolai-explorer.conf /etc/nginx/sites-available/zolai-studio
#   sudo nginx -t && sudo systemctl reload nginx
#
# Because the studio is a separate server_name, nothing here can interfere with
# the FastAPI surface on api.zolai.space. That vhost keeps `location /` proxied
# to 127.0.0.1:8001 and only 301-redirects /explorer* to this host.

server {
    listen 80;
    listen [::]:80;
    server_name studio.zolai.space;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;

    server_name studio.zolai.space;

    ssl_certificate     /etc/letsencrypt/live/studio.zolai.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.zolai.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # `dist/` is rsynced straight into this root, so $uri resolves directly
    # (no `root` + prefix concatenation trick is needed at base '/').
    root /var/www/zolai-studio;
    index index.html;

    # ---------------------------------------------------------------- #
    # Security headers (issue #1).                                     #
    #                                                                  #
    # There is no backend of our own to send these from, so the static  #
    # host is the only layer that can — and a header set on the HTML    #
    # document is what a browser actually applies to the page.          #
    #                                                                  #
    # nginx inheritance: `add_header` at a LOWER level REPLACES every   #
    # `add_header` inherited from above as soon as that level declares  #
    # one. The two Cache-Control locations below therefore re-declare   #
    # this whole block — dropping the repeats would silently strip CSP  #
    # from /index.html, the one response that matters most.             #
    #                                                                  #
    # HSTS lives only in this TLS server block: it is meaningless over  #
    # plain HTTP, so the :80 block (ACME + redirect) never sends it and #
    # local dev (`bun run dev` / `vite preview`, no nginx) is untouched.#
    # ---------------------------------------------------------------- #
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP tuned against the built bundle, not guessed:
    #  - exactly ONE inline script in dist/index.html (the pre-paint theme
    #    bootstrap; source and dist are byte-identical), allowed by its
    #    sha256 — src/lib/csp.test.ts recomputes it and fails if either side
    #    drifts. No `unsafe-inline` for scripts, no `eval` anywhere in dist.
    #  - style-src keeps `unsafe-inline`: React/recharts set style *attributes*
    #    (e.g. the zero-based bars on /data), which a hash cannot cover.
    #  - connect-src is `self` + https://api.zolai.space — the only origin the
    #    bundle fetches (API + /health); no CDN fonts, no `.map` files, no
    #    workers, no `blob:`/`data:` images in dist.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-5t9Tmxoqq33jC9shpiXsBhTMwyCisnslEYz9rNsbMk8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.zolai.space; upgrade-insecure-requests" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nothing in a read-mostly studio needs the camera, the mic or the
    # clipboard-read path; `fullscreen` stays allowed for charts/video-free
    # zoom only where the document itself asks for it.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), picture-in-picture=(), usb=(), web-share=()" always;

    # SPA: every deep link (/word/pasian, /links, ...) falls back to index.html.
    # `$uri` first is the contract for /robots.txt and /.well-known/security.txt:
    # they ship from public/ (→ dist/), so a literal file always wins here and
    # only unknown paths get the index page — see src/lib/staticFiles.test.ts.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets are immutable — cache them for a year.
    # The security headers are repeated here on purpose (see the note above).
    location /assets/ {
        add_header Cache-Control "public,max-age=31536000,immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-5t9Tmxoqq33jC9shpiXsBhTMwyCisnslEYz9rNsbMk8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.zolai.space; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), picture-in-picture=(), usb=(), web-share=()" always;
    }

    # The entry document must always be revalidated so a deploy is picked up.
    # Same inheritance rule: this block must repeat the security headers too.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-5t9Tmxoqq33jC9shpiXsBhTMwyCisnslEYz9rNsbMk8='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.zolai.space; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), picture-in-picture=(), usb=(), web-share=()" always;
    }
}